name: Run Facebook Bot 1

on:
  workflow_dispatch:

# 🔒 منع التزامن وتكرار التشغيل
concurrency:
  group: bot1-execution-group
  cancel-in-progress: true

jobs:
  run-bot1:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب كود المستودع
        uses: actions/checkout@v4

      # 💡 إضافة جديدة: تغيير توقيت السيرفر ليتطابق مع منطقتنا (يمنع شكوك فيسبوك)
      - name: ⏱️ ضبط توقيت السيرفر الزمني
        run: |
          sudo timedatectl set-timezone Asia/Riyadh
          date

      - name: 🟢 إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 💡 إضافة جديدة: تثبيت مكتبات التخفي (Stealth) لخداع خوارزميات فيسبوك
      - name: 📦 تثبيت المكتبات (Dependencies)
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth @supabase/supabase-js axios ws express

      - name: 🌐 تثبيت متصفح Chromium الخاص بـ Playwright
        run: |
          npx playwright install --with-deps chromium

      - name: 🚀 تشغيل البوت الأول (bot1.js)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node bot1.js
